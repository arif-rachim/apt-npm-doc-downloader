# Builds the airgap binaries for Ubuntu (Linux) and Windows.
#
# - Push a tag like v0.1.0 to publish a GitHub Release with the binaries,
#   the source tarball and SHA256SUMS attached.
# - Run it by hand from the Actions tab (workflow_dispatch) to get the same
#   files as a downloadable workflow artifact without publishing a release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build release binaries
        run: ./build.sh release
      - uses: actions/upload-artifact@v4
        with:
          name: airgap-binaries
          path: dist/*
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "airgapkit $GITHUB_REF_NAME" \
            --generate-notes
